# Render Blueprint: KEMI 백엔드(apps/api)의 목표 설정
# 현재 kemi-api 서비스는 수동으로 만들었고 이 파일과 연결돼 있지 않다(2026-10-26).
# 이 파일은 새 환경을 처음 만들 때만 적용한다. 기존 서비스는 절차서 2-2대로 대시보드에서 맞춘다.
# 절차: docs/runbooks/auth-deploy-verification.md 2단계
# 비밀값은 이 파일에 적지 않는다. sync: false 항목은 Blueprint를 처음 만들 때 Render 화면에서 입력한다.
services:
  - type: web
    name: kemi-api
    runtime: node
    plan: free
    # 개발용 Supabase(ap-northeast-1, 도쿄)와 가장 가까운 리전. 만든 뒤에는 바꿀 수 없다.
    region: singapore
    branch: main
    # main에 병합된 커밋 중 GitHub CI(API·Web)를 통과한 것만 배포한다.
    autoDeployTrigger: checksPass
    # 린트·Prisma CLI·TypeScript가 devDependencies라서 NODE_ENV=production이어도 설치되게 한다.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm start -w @kemi/api
    # DB를 보지 않는 생존 확인. DB 장애로 서버가 계속 재시작되지 않게 한다.
    healthCheckPath: /health
    # 마이그레이션은 배포 때 자동으로 돌리지 않는다(preDeployCommand 없음).
    # 팀 DB 적용 절차(이슈 공유 → 읽기 전용 점검 → db:deploy → 확인)를 따로 거친다.
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "5"
      # Render가 만든 256비트 임의 값(base64 44자). 로컬 .env의 값과 다르다.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      # 0으로 시작하고, 배포 후 절차서 4단계에서 확인한 값으로 바꾼다.
      - key: TRUST_PROXY_HOPS
        value: "0"
      # 운영에서도 API 문서(/api/docs Swagger UI, /api/openapi.json)를 열지. 기본 false
      - key: API_DOCS
        value: "false"
      # 소셜 로그인 키(GOOGLE_CLIENT_ID·GOOGLE_CLIENT_SECRET·KAKAO_REST_API_KEY·KAKAO_CLIENT_SECRET)는
      # 발급되면 Render 대시보드 Environment에서 직접 추가한다. 이 파일에 없는 변수는 동기화해도 지워지지 않는다.
