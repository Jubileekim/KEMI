const start=()=>({page:'intro',reached:0,meeting:false,purpose:'식전 상영',method:'자료 편집',mood:'감성',ratio:'16:9',due:'2주 이내',budget:'상담 후 결정',eventDate:'2026-11-14',query:'',filterStyle:'전체',filterRatio:'전체',order:MOVIES.map(v=>v.id),saved:new Set(),selected:new Set(),inquiryName:'예비부부',inquiryText:'11월 결혼식 식전 상영용 영상을 만들고 싶습니다. 가지고 있는 사진과 짧은 영상 클립을 활용하고, 저장한 작품처럼 따뜻하고 자연스러운 분위기로 편집해 주세요. 제작 가능 여부와 예상 일정 및 견적을 알려주세요.',inquiryDue:'2026-11-07',inquiryBudget:'협의 가능',fileNames:[],submitted:false});
let state=start();
const app=document.querySelector('#app');const $=s=>document.querySelector(s);let toastHandle;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.remove('show'),2500)}
function getM(id){return MOVIES.find(m=>m.id===id)}
function selectedMovies(){return [...state.selected].filter(id=>state.saved.has(id)).map(getM).filter(Boolean)}
function savedMovies(){return MOVIES.filter(m=>state.saved.has(m.id))}
function grouped(videos){const out=new Map();videos.forEach(m=>{if(!out.has(m.creator))out.set(m.creator,[]);out.get(m.creator).push(m)});return out}
function summaryLine(label,value){return `<div class="summary-item"><label>${label}</label><b>${escapeHTML(value)}</b></div>`}
function reviewTip(){if(!state.meeting)return '';const tips={intro:'핵심 의사결정: 개인 고객(B2C)을 MVP에 포함할 것인가? 본 시나리오는 기존 UGC 광고 모델을 변경하는 결정이 아니라 UX 실험이다.',brief:'‘보유 자료 편집’에 범위를 한정한 이유: 예식 현장 촬영·출장 일정·지역 매칭까지 포함하면 신규 복잡성이 크게 증가한다.',discover:'검증 질문: 동일 제작자의 서로 다른 작품이 각각 검색되는가? 썸네일 중심 탐색이 실제로 이해되는가? 영상은 아직 시안용 정지 이미지다.',saved:'검증 질문: 북마크(장기 저장)와 이번 문의에 쓸 영상 선택이 혼동 없이 구분되는가?',inquiry:'검증 질문: 동일 제작자의 작품 여러 개를 1건으로 묶고 공통 요청을 단 한 번만 쓰는 이점이 전달되는가?',review:'후속 범위 검토: 제작자 협의 → 계약 체결 → 에스크로 선결제 → 시안 제출 → 수정/납품 → 승인/정산 → 리뷰. 계약보다 시안이 먼저 가지 않도록 한다.'};return `<aside class="meeting-panel"><span class="meeting-icon">💬</span><div><strong>회의 체크포인트 · ${LABELS[SCREENS.indexOf(state.page)]}</strong><p>${tips[state.page]}</p></div></aside>`}
function steps(){const active=SCREENS.indexOf(state.page);$('#steps').innerHTML=SCREENS.map((key,i)=>`${i?'<span class="step-connector" aria-hidden="true"></span>':''}<button class="step ${i===active?'active':i<=state.reached?'visited':''}" type="button" data-action="step" data-id="${key}" aria-current="${i===active?'step':'false'}" ${i>state.reached?'disabled title="앞 단계 진행 후 이용 가능"':''}><i>${i+1}</i><span>${LABELS[i]}</span></button>`).join('')+'<span class="step-future">다음: 협의 · 계약 · 결제 · 납품 (후속 범위)</span>';document.querySelector('[data-action="meeting"]').classList.toggle('active',state.meeting)}
function navigate(page){if(!SCREENS.includes(page))return;state.page=page;state.reached=Math.max(state.reached,SCREENS.indexOf(page));if(location.hash!==`#${page}`)history.pushState({page},'',`#${page}`);render();window.scrollTo({top:0,behavior:'instant'})}
function btn(label,action,cls='primary',attrs=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${attrs}>${label}</button>`}
function header(kicker,title,desc,trail=''){return `<div class="section-title-row"><div><div class="eyebrow">${kicker}</div><h2 style="margin-top:13px">${title}</h2><p>${desc}</p></div>${trail}</div>`}
function intro(){return `${reviewTip()}<section class="intro-hero"><div class="intro-copy"><div class="eyebrow">PERSONA 01 · 생활밀착형 개인 의뢰 · UX 실험</div><h1>결혼식은 약 3주 뒤.<br><span class="highlight">우리 이야기,</span><br>영상으로 남기고 싶어요.</h1><p class="lead">사진과 짧은 영상은 준비했지만 식전영상을 직접 만들기는 어려운 예비부부. 원하는 분위기의 작품을 보고 저장한 뒤, 제작자에게 참고 영상과 조건을 함께 보내보세요.</p><div class="intro-actions">${btn('내 영상 스타일 찾아보기 '+icon('arrow'),'start')}${btn('데모 흐름 살펴보기','overview','')}</div><div class="persona-meta"><span class="pill">예비부부</span><span class="pill">예식 11월 14일 (예시)</span><span class="pill">보유 자료 편집</span><span class="pill">기한이 있는 일회성 의뢰</span></div></div><div class="hero-gallery"><div class="hero-glass"></div><div class="floating-frame"><img src="${MOVIES[0].src}" alt="감성 식전영상 샘플 프레임"><strong>감성 식전영상 · 00:58</strong></div><div class="floating-frame"><img src="${MOVIES[2].src}" alt="미니멀 식전영상 샘플 프레임"><strong>정갈한 오프닝 · 01:00</strong></div><div class="floating-frame"><img src="${MOVIES[3].src}" alt="경쾌한 티저 샘플 프레임"><strong>재치 있는 티저 · 00:28</strong></div><div class="glass-orb"></div></div></section><div class="intro-secondary"><div class="persona-card"><div class="pill amber">이번 데모의 정확한 니즈</div><div class="heading">“식장 스크린에 틀 1분 영상이 필요해요.”</div><p>신혼부부가 제공한 사진·클립으로 16:9 식전 영상을 편집하는 의뢰. 촬영·출장은 이번 범위에 포함하지 않음.</p></div><div class="persona-card muted-card"><div class="key">PERSONA 02 · 후속 검토</div><div class="heading">돌잔치 성장영상</div><p>기존 사진을 활용한 60초 성장영상. 생활 밀착형·기한 명확.</p></div><div class="persona-card muted-card"><div class="key">PERSONA 03 · 기존 사업 적합</div><div class="heading">1인 카페 오픈 홍보 릴스</div><p>주말 오픈을 앞두고 짧은 광고 영상을 의뢰하는 소상공인.</p></div></div><div class="soft-note amber section-gap"><strong>서비스 범위 참고</strong> · 결혼식 영상 제작은 광고용 UGC 중심의 기존 KEMI보다 고객군이 넓어지는 시나리오입니다. 본 데모는 B2C 유입·문의 UX를 검증하기 위한 가상 실험이며, 실제 MVP 포함 여부는 팀이 결정해야 합니다.</div>${foot()}`}
function overviewModal(){const dlg=$('#preview');$('#preview-content').innerHTML=`<div class="dialog-inner"><div class="space-between"><div><div class="eyebrow">USER JOURNEY</div><h2 style="margin-top:12px">클릭형 UX 데모 흐름</h2></div><button class="small-button" type="button" data-action="close">닫기 ✕</button></div><p class="lead" style="margin:15px 0 22px">실제 고객처럼 버튼을 누르면 다음 화면으로 이동합니다. 문의 발송·결제·파일 업로드는 실행되지 않습니다.</p><div class="stack">${SCREENS.map((s,i)=>`<div class="space-between card card-pad"><b>${String(i+1).padStart(2,'0')} · ${LABELS[i]}</b><span class="tiny">${['니즈 확인','범위와 분위기 선택','작품별 탐색·북마크','저장과 문의 선택 분리','제작자별 묶음 + 공통 브리프','발송 시뮬레이션과 후속 단계'][i]}</span></div>`).join('')}</div><div class="soft-note section-gap">계약 및 결제 이후 흐름은 이 데모에서 실제 동작하지 않으며, 전체 프로젝트의 후속 구현 로드맵으로만 표시합니다.</div><div class="modal-actions">${btn('시작하기 '+icon('arrow'),'start')} ${btn('닫기','close','')}</div></div>`;dlg.showModal()}
function choiceButtons(group,options,value){return options.map(({val,label,desc,disabled})=>`<button class="option ${value===val?'selected':''} ${disabled?'disabled':''}" type="button" data-action="choice" data-group="${group}" data-val="${escapeHTML(val)}" aria-pressed="${value===val}" ${disabled?'disabled':''}><strong>${label}</strong><span>${desc||''}</span></button>`).join('')}
function brief(){let right=`<div class="card brief-aside"><div class="aside-gradient"></div><div class="aside-inner"><div class="eyebrow">LIVE BRIEF SUMMARY</div><h3 style="margin-top:12px">내 요청 초안</h3><div class="summary-list">${summaryLine('목적',state.purpose)}${summaryLine('작업 범위',state.method)}${summaryLine('영상 분위기',state.mood)}${summaryLine('영상 비율',state.ratio)}${summaryLine('희망 기간',state.due)}${summaryLine('예산',state.budget)}</div><div class="form-note">아직 크리에이터에게 전달되지 않습니다. 선택한 조건은 다음 영상 탐색에서 추천 참고값으로 사용됩니다.</div><div style="margin-top:17px">${btn('조건으로 영상 살펴보기 '+icon('arrow'),'to-discover','primary','style="width:100%"')}</div></div></div>`;return `${reviewTip()}${header('02 / QUESTIONNAIRE','내게 필요한 영상을 짧게 정리해요','예비부부의 구체적인 상황이 그대로 검색 조건과 첫 문의 문구로 연결됩니다.','<span class="pill">예시 답변 입력됨</span>')}<div class="brief-layout"><div><section class="card question"><div class="question-head"><small>Q1</small> 어디에 사용할 영상인가요?</div><div class="option-grid">${choiceButtons('purpose',[{val:'식전 상영',label:'식전 상영',desc:'예식장 스크린에서 사용'},{val:'모바일 청첩장',label:'모바일 청첩장',desc:'짧은 초대 티저'},{val:'결혼 후기',label:'결혼 후기',desc:'SNS용 하이라이트'}],state.purpose)}</div></section><section class="card question"><div class="question-head"><small>Q2</small> 어떤 자료로 제작하나요?</div><div class="option-grid two">${choiceButtons('method',[{val:'자료 편집',label:'사진·영상 직접 제공',desc:'촬영 없이 편집 중심'},{val:'현장 촬영',label:'현장 촬영 포함',desc:'추가 범위 검토 필요',disabled:true}],state.method)}</div><p class="tiny" style="margin-top:10px">이번 데모는 기존 자료 편집형 제작으로 한정합니다.</p></section><section class="card question"><div class="question-head"><small>Q3</small> 원하는 영상 분위기는?</div><div class="option-grid">${choiceButtons('mood',[{val:'감성',label:'따뜻한 감성',desc:'필름·잔잔한 음악'},{val:'미니멀',label:'담백·미니멀',desc:'정갈한 타이포'},{val:'유쾌한',label:'재치·유쾌',desc:'경쾌한 컷과 리듬'}],state.mood)}</div></section><section class="card question"><div class="question-head"><small>Q4</small> 제작 조건은 어떻게 생각하나요?</div><div class="field" style="margin-bottom:12px"><label for="event-date">예식일 (시연용 날짜)</label><input id="event-date" type="date" value="${state.eventDate}" aria-label="예식일"></div><div style="font-size:12px;font-weight:750;color:#405d49;margin-bottom:9px">화면 비율</div><div class="option-grid two" style="margin-bottom:15px">${choiceButtons('ratio',[{val:'16:9',label:'가로 16:9',desc:'식전 상영용'},{val:'9:16',label:'세로 9:16',desc:'SNS·모바일용'}],state.ratio)}</div><div style="font-size:12px;font-weight:750;color:#405d49;margin-bottom:9px">희망 제작 기간</div><div class="option-grid" style="margin-bottom:15px">${choiceButtons('due',[{val:'1주 이내',label:'1주 이내',desc:'빠른 일정'},{val:'2주 이내',label:'2주 이내',desc:'기본 선택'},{val:'3주 이내',label:'3주 이내',desc:'여유 있게'}],state.due)}</div><div style="font-size:12px;font-weight:750;color:#405d49;margin-bottom:9px">희망 예산 (고객 입력값·시세 아님)</div><div class="option-grid">${choiceButtons('budget',[{val:'상담 후 결정',label:'상담 후 결정',desc:'제작자와 협의'},{val:'15~30만 원',label:'15~30만 원',desc:'희망 예산'},{val:'30~50만 원',label:'30~50만 원',desc:'희망 예산'}],state.budget)}</div></section><div class="row">${btn(icon('back')+' 시작 화면','to-intro','')}${btn('영상 탐색으로 이동 '+icon('arrow'),'to-discover')}</div></div>${right}</div>${foot()}`}
function visibleMovies(){let q=state.query.toLocaleLowerCase().trim();return state.order.map(getM).filter(Boolean).filter(m=>(state.filterStyle==='전체'||m.style===state.filterStyle)&&(state.filterRatio==='전체'||m.ratio===state.filterRatio)&&(!q||[m.title,m.creator,m.style,m.ratio,m.description].some(x=>x.toLocaleLowerCase().includes(q))))}
function videoCard(m){const b=state.saved.has(m.id);return `<article class="video-card"><div class="poster"><img src="${m.src}" alt="${escapeHTML(m.title)} 시연용 일러스트 커버"><button class="mark-save" type="button" aria-label="${escapeHTML(m.title)} ${b?'북마크 해제':'북마크 저장'}" aria-pressed="${b}" data-action="save" data-id="${m.id}">${icon('bookmark')}</button><button class="play-control" type="button" data-action="preview" data-id="${m.id}" aria-label="${escapeHTML(m.title)} 미리보기">${icon('play')} 미리보기</button><span class="video-length">${m.duration}</span></div><div class="card-body"><div class="card-title">${escapeHTML(m.title)}</div><div class="card-sub"><span>${escapeHTML(m.style)} · ${m.ratio}</span><span>작품 #${m.id}</span></div><div class="card-foot"><button class="by" type="button" data-action="creator" data-id="${m.id}">by ${escapeHTML(m.creator)}</button><span class="pill">${escapeHTML(m.style)}</span></div></div></article>`}
function dock(){const items=savedMovies(),creators=grouped(items).size;return items.length?`<div class="saved-dock" aria-live="polite"><div class="thumb-stack">${items.slice(0,3).map(m=>`<img src="${m.src}" alt="">`).join('')}</div><div class="dock-stat"><strong>저장한 영상 ${items.length}개 · 제작자 ${creators}명</strong><small>저장만 했어요. 아직 누구에게도 문의가 가지 않았어요.</small></div>${btn('저장함 열기 '+icon('arrow'),'to-saved','primary')}</div>`:''}
function discover(){const vis=visibleMovies();return `${reviewTip()}${header('03 / VIDEO FIRST','영상으로 먼저 고르고, 마음에 들면 저장해요.','같은 제작자의 영상도 각 작품의 분위기와 태그에 맞춰 독립적으로 나타납니다.',btn(icon('bookmark')+` 저장한 영상 ${state.saved.size}개`,'to-saved',''))}<div class="card discovery-bar"><div class="search-layout"><label class="searchbox"><span class="sr-only">영상 검색</span>${icon('search')}<input id="video-search" class="search-field" placeholder="영상 제목, 제작자, 스타일로 검색" value="${escapeHTML(state.query)}" autocomplete="off"></label>${btn('다시 섞어 보기 '+icon('shuffle'),'shuffle','')}</div><div class="filter-row"><div class="chips">${['전체','감성','미니멀','유쾌한'].map(x=>`<button class="chip" type="button" data-action="filter-style" data-val="${x}" aria-pressed="${state.filterStyle===x}">${x==='감성'?'따뜻한 감성':x}</button>`).join('')}</div><div class="row"><span class="pill">선호 분위기: ${state.mood}</span><label class="sr-only" for="ratio-filter">화면 비율</label><select id="ratio-filter" class="filter-select">${['전체','16:9','9:16'].map(v=>`<option value="${v}" ${state.filterRatio===v?'selected':''}>${v==='전체'?'비율 전체':v}</option>`).join('')}</select></div></div></div><div class="space-between" style="margin:0 0 17px"><div><b style="font-size:15px">샘플 포트폴리오 <span style="color:#539863">${vis.length}</span></b><p class="tiny" style="margin-top:3px">실제 영상 파일이 아닌 일러스트 커버로 작동을 시연합니다.</p></div><span class="pill blue">서로 다른 제작자 작품을 섞어 노출</span></div>${vis.length?`<div class="video-grid">${vis.map(videoCard).join('')}</div>`:`<div class="empty"><div class="empty-icon">⌕</div><h3>조건에 맞는 영상이 없어요.</h3><p>다른 스타일을 선택하거나 검색어를 바꿔보세요.</p>${btn('필터 초기화','clear-filters','')}</div>`}${dock()}<div class="row section-gap">${btn(icon('back')+' 조건 수정','to-brief','')}${btn('저장한 작품 확인하기 '+icon('arrow'),'to-saved','')}</div>${foot()}`}
function saved(){const movies=savedMovies(),sel=selectedMovies();const gr=grouped(sel);return `${reviewTip()}${header('04 / SAVED COLLECTION','좋았던 영상은 모으고, 이번 문의에 쓸 작품만 골라요.','북마크는 보관, 체크박스는 이번 문의에 참고할 영상 선택입니다.')}${!movies.length?`<div class="empty"><div class="empty-icon">♧</div><h3>아직 저장한 영상이 없어요.</h3><p>영상 탐색에서 북마크를 누르거나, 회의용 샘플 선택을 불러올 수 있어요.</p><div class="row" style="justify-content:center">${btn('영상 둘러보기','to-discover','')}${btn('샘플 4개 저장하기','preset')}</div></div>`:`<div class="saved-layout"><div class="card card-pad"><div class="space-between" style="margin-bottom:18px"><div><h3>북마크한 영상 <span class="muted">${movies.length}</span></h3><p class="tiny">이번 문의에 포함할 영상을 체크해 주세요.</p></div><div class="row">${btn('모두 선택','select-all','small')}${btn('선택 해제','select-none','small')}</div></div><div class="saved-list">${movies.map(m=>`<article class="saved-item"><input class="check-input" type="checkbox" data-select="${m.id}" aria-label="${escapeHTML(m.title)} 문의에 포함" ${state.selected.has(m.id)?'checked':''}><img src="${m.src}" alt=""><div><b>${escapeHTML(m.title)}</b><small>${escapeHTML(m.creator)} · ${m.style} · ${m.ratio}</small></div><button class="small-button item-remove" type="button" data-action="save" data-id="${m.id}" aria-label="북마크 삭제">제거</button></article>`).join('')}</div></div><aside class="card card-pad aside-check"><div class="eyebrow">INQUIRY SELECTION</div><h3 style="margin-top:11px">이번 문의 대상</h3><div class="summary-list">${summaryLine('선택한 영상',`${sel.length}개`)}${summaryLine('제작자',`${gr.size}명`)}${summaryLine('문의 작성', '공통 내용 1회')}</div>${gr.size?[...gr.entries()].map(([name,mm])=>`<div class="mini-group"><header><strong>${escapeHTML(name)}</strong><small class="tiny">작품 ${mm.length}개 → 문의 1건</small></header><div class="mini-thumbs">${mm.map(m=>`<img src="${m.src}" alt="${escapeHTML(m.title)}">`).join('')}</div></div>`).join(''):'<p class="tiny" style="padding:15px 0">문의할 작품을 체크하면 제작자별로 묶여 표시돼요.</p>'}<div style="margin-top:20px">${btn(`${gr.size}명에게 문의 준비하기 `+icon('arrow'),'to-inquiry','primary',`${!gr.size?'disabled':''} style="width:100%"`)}</div><div class="soft-note" style="margin-top:15px">같은 제작자의 작품을 2개 골라도 문의는 <b>제작자별 1건</b>입니다.</div></aside></div>`}<div class="row section-gap">${btn(icon('back')+' 영상 더 찾아보기','to-discover','')}</div>${foot()}`}
function creatorGroupCards(gr){return [...gr.entries()].map(([name,movies])=>`<div class="creator-summary"><div class="creator-summary-head"><span>${escapeHTML(name)}</span><span class="pill">영상 ${movies.length}개 · 문의 1건</span></div>${movies.map(m=>`<div class="creator-summary-work"><img src="${m.src}" alt=""><div><b style="font-size:12px">${escapeHTML(m.title)}</b><br><span>${m.style} · ${m.ratio}</span></div></div>`).join('')}</div>`).join('')}
function inquiry(){const selected=selectedMovies();if(!selected.length){return `${reviewTip()}${header('05 / GROUPED INQUIRY','먼저 참고 영상을 선택해 주세요.','저장함에서 문의에 사용할 영상을 체크해야 합니다.')}<div class="empty">${btn('저장함으로 이동','to-saved')}</div>${foot()}`;}const gr=grouped(selected);return `${reviewTip()}${header('05 / GROUPED INQUIRY','여러 작품을 참고해, 요청은 한 번만 작성해요.','선택한 영상은 제작자별로 묶여 전달됩니다. 서로 다른 제작자에게는 각각 개별 문의가 생성되는 구조입니다.') }<div class="composer-layout"><div><div class="card card-pad"><div class="space-between"><h3>선택한 참고 작품</h3><span class="pill">영상 ${selected.length}개 · 제작자 ${gr.size}명</span></div><p class="tiny" style="margin-top:6px">같은 제작자의 영상은 한 요청에 함께 묶습니다.</p>${creatorGroupCards(gr)}</div><div class="soft-note amber section-gap">영상은 <b>스타일 참고용</b>입니다. 실제 영상의 무단 복제·재사용이나 권리 양도를 의미하지 않습니다.</div></div><div class="card composer-form"><div class="eyebrow">ONE BRIEF · MULTIPLE CREATORS</div><h3 style="margin:12px 0 20px">공통 제작 문의</h3><div class="field"><label for="inquiry-name">의뢰인 이름 또는 표시명</label><input id="inquiry-name" value="${escapeHTML(state.inquiryName)}" placeholder="예: 예비부부"></div><div class="field"><label for="inquiry-message">어떤 영상을 제작하고 싶나요?</label><textarea id="inquiry-message" rows="6" placeholder="영상 내용과 꼭 포함할 요소를 작성하세요.">${escapeHTML(state.inquiryText)}</textarea></div><div class="form-two"><div class="field"><label for="inquiry-due">희망 최종 납품일</label><input id="inquiry-due" type="date" value="${state.inquiryDue}"></div><div class="field"><label for="inquiry-budget">희망 예산</label><input id="inquiry-budget" value="${escapeHTML(state.inquiryBudget)}" placeholder="협의 가능"></div></div><div class="field section-gap"><label for="demo-file">보유 사진·클립 (선택 사항)</label><div class="attachment">파일은 이 브라우저에서 선택만 됩니다. 서버로 업로드하지 않습니다.<input type="file" id="demo-file" accept="image/*,video/*" multiple><div id="file-list" class="tiny" style="margin-top:5px">${state.fileNames.length?state.fileNames.map(escapeHTML).join(', '):'현재 선택한 파일 없음'}</div></div></div><label class="checkline"><input type="checkbox" id="check-rights" ${state.rightsChecked?'checked':''} style="accent-color:#539863;margin-top:4px"><span>제공할 사진·영상에 필요한 사용 권한을 직접 확인하겠습니다. (데모 확인용)</span></label><div class="soft-note" style="margin-top:20px">이 화면은 <b>문의 작성 시뮬레이션</b>입니다. 실제 메시지, 파일, 결제 정보는 전송되지 않습니다.</div><div class="row" style="margin-top:23px;justify-content:space-between">${btn(icon('back')+' 저장함 수정','to-saved','')}${btn('문의 최종 검토 '+icon('arrow'),'to-review','primary')}</div></div></div>${foot()}`}
function future(){let tasks=['제작자 답변·협의','제작 조건 확정','양측 계약 체결','에스크로 선결제','1차 시안 제출','수정 및 최종 납품','승인·정산','리뷰 작성'];return `<section class="card card-pad section-gap" style="margin-top:26px"><div class="space-between"><div><div class="eyebrow">FUTURE JOURNEY · NOT IMPLEMENTED</div><h3 style="margin-top:11px">그 다음은 이렇게 연결됩니다.</h3></div><span class="pill amber">회의용 예정 단계</span></div><p class="tiny" style="margin-top:5px">현재 데모에서는 아래 기능이 실제로 동작하지 않습니다. 계약 후 에스크로 선결제, 이후 시안·납품·승인 순서를 권장합니다.</p><div class="future-grid">${tasks.map((t,i)=>`<div class="future-step"><span class="pill grey">${String(i+1).padStart(2,'0')}</span><b>${t}</b><small>후속 설계</small></div>`).join('')}</div></section>`}
function review(){const selected=selectedMovies();if(!selected.length){return `${reviewTip()}${header('06 / INQUIRY REVIEW','문의할 영상이 아직 없어요.','저장함에서 문의에 사용할 작품을 선택해 주세요.')}<div class="empty">${btn('저장함으로 이동','to-saved')}</div>${foot()}`;}const gr=grouped(selected);if(state.submitted)return `${reviewTip()}<div class="card card-pad" style="text-align:center;padding:65px 25px"><div style="width:70px;height:70px;margin:0 auto 17px;display:grid;place-items:center;background:linear-gradient(135deg,#71b48c,#afd368,#f7db56);border-radius:50%;color:white;font-size:34px">✓</div><div class="eyebrow" style="justify-content:center">SIMULATION COMPLETE</div><h1 style="font-size:35px">문의 발송을 시연했어요.</h1><p class="lead" style="margin:auto">가상의 제작자 ${gr.size}명에게 각각 문의가 생성되는 화면을 시뮬레이션했습니다. <b>실제 발송·결제·데이터 저장은 전혀 발생하지 않았습니다.</b></p><div class="row" style="justify-content:center;margin-top:26px">${btn('다른 영상도 둘러보기','to-discover','')}${btn('처음부터 다시','reset')}</div></div>${future()}${foot()}`;
return `${reviewTip()}${header('06 / INQUIRY REVIEW','보내기 전에, 문의 대상을 다시 확인해요.','문의할 제작자와 참고 영상을 확인한 뒤 발송 동작을 시연할 수 있습니다.') }<div class="review-grid"><div class="metric"><b>${selected.length}</b><small>참고 영상</small></div><div class="metric"><b>${gr.size}</b><small>문의 대상 제작자</small></div><div class="metric"><b>1</b><small>공통 문의 작성 횟수</small></div></div><div class="review-layout"><div class="card card-pad"><h3>제작자별 문의 내역</h3><p class="tiny" style="margin-top:4px">같은 제작자에게는 참고 작품을 묶어 문의합니다.</p>${creatorGroupCards(gr)}</div><div class="card card-pad"><h3>공통으로 전할 내용</h3><div class="summary-list">${summaryLine('의뢰인',state.inquiryName)}${summaryLine('목적',state.purpose)}${summaryLine('자료',state.method)}${summaryLine('영상 비율',state.ratio)}${summaryLine('희망 납품',state.inquiryDue)}${summaryLine('예산',state.inquiryBudget)}</div><div class="review-content">${escapeHTML(state.inquiryText||'문의 내용이 없습니다.')}</div><div class="soft-note amber" style="margin-top:13px">현재 버튼은 UI 동작만 시뮬레이션합니다. 메시지는 제작자에게 전송되지 않습니다.</div><div class="row" style="margin-top:21px">${btn('내용 수정','to-inquiry','')}${btn(`${gr.size}명에게 발송 시뮬레이션`,'submit-demo','primary')}</div></div></div>${future()}${foot()}`}
function foot(){return `<footer class="demo-footer"><span>KEMI · UX LAB · 2026.10 · 클릭형 데모 · 모든 제작자/영상/가격은 가상 예시</span><span>결혼식 영상 시나리오의 실제 서비스 편입은 팀 검토 필요</span></footer>`}
function render(){steps();document.title='KEMI | '+LABELS[SCREENS.indexOf(state.page)]+' · UX 데모';const pages={intro,brief,discover,saved,inquiry,review};const result=pages[state.page]();if(result!==undefined)app.innerHTML=result;document.querySelector('#app').setAttribute('aria-label',LABELS[SCREENS.indexOf(state.page)]+' 화면')}
function previewMovie(id){let m=getM(id);if(!m)return;let saved=state.saved.has(id);$('#preview-content').innerHTML=`<div class="dialog-visual"><img src="${m.src}" alt="${escapeHTML(m.title)} 샘플 일러스트"><button type="button" class="dismiss" data-action="close" aria-label="닫기">${icon('close')}</button></div><div class="dialog-inner"><div class="eyebrow">VIDEO PREVIEW · SAMPLE STILL</div><h2 style="margin:11px 0 6px">${escapeHTML(m.title)}</h2><p class="muted" style="font-size:13px">${escapeHTML(m.creator)} · ${m.style} · ${m.ratio} · ${m.duration}</p><p style="font-size:13px;margin-top:15px">${escapeHTML(m.description)}</p><div class="soft-note amber" style="margin-top:17px">현재 영상 대신 시연용 일러스트가 표시됩니다. 동영상 플레이어는 실제 작품 연결 후 구현합니다.</div><div class="modal-actions">${btn(icon('bookmark')+(saved?' 저장 해제':' 이 영상 저장'), 'preview-save','primary',`data-id="${m.id}"`)}${btn('닫고 계속 둘러보기','close','')}</div></div>`;$('#preview').showModal()}
function creatorInfo(id){let m=getM(id);let videos=MOVIES.filter(v=>v.creator===m.creator);$('#preview-content').innerHTML=`<div class="dialog-inner"><div class="space-between"><div><div class="eyebrow">CREATOR · SECONDARY PATH</div><h2 style="margin:12px 0">${escapeHTML(m.creator)}</h2></div><button class="small-button" type="button" data-action="close">닫기 ✕</button></div><p class="muted" style="font-size:13px;margin-bottom:17px">프로필은 개별 영상 탐색을 보조하는 화면입니다. 같은 제작자의 등록 영상도 메인 피드에 각각 노출됩니다.</p><div class="video-grid" style="grid-template-columns:repeat(${Math.min(videos.length,2)},1fr)">${videos.map(videoCard).join('')}</div><div class="modal-actions">${btn('영상 피드로 돌아가기','close','')}</div></div>`;$('#preview').showModal()}
function toggleSaved(id){if(state.saved.has(id)){state.saved.delete(id);state.selected.delete(id);notify('북마크를 해제했어요.')}else{state.saved.add(id);state.selected.add(id);notify('영상이 저장됐어요. 아직 문의는 전송되지 않았어요.')}if($('#preview').open)$('#preview').close();render()}
function demoPreset(){['01','02','05','03'].forEach(id=>{state.saved.add(id);state.selected.add(id)});render();notify('샘플 영상 4개를 저장했어요. (제작자 3명)')}
function shuffleOrder(){let ar=[...state.order];for(let i=ar.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ar[i],ar[j]]=[ar[j],ar[i]]}state.order=ar;render();notify('영상 순서를 새로 섞었어요.')}
function saveFields(){let ids={'inquiry-name':'inquiryName','inquiry-message':'inquiryText','inquiry-due':'inquiryDue','inquiry-budget':'inquiryBudget'};for(let id in ids){let n=document.getElementById(id);if(n)state[ids[id]]=n.value}let ch=document.getElementById('check-rights');if(ch)state.rightsChecked=ch.checked}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case 'meeting':state.meeting=!state.meeting;render();break;case 'reset':if(!confirm('데모를 처음부터 시작할까요? 현재 저장한 영상과 입력 내용이 초기화됩니다.'))break;state=start();navigate('intro');notify('처음 상태로 돌아왔어요.');break;case 'step':if(SCREENS.indexOf(id)<=state.reached){if(state.page==='inquiry')saveFields();navigate(id)}break;case 'overview':overviewModal();break;case 'start':$('#preview').close();navigate('brief');break;case 'choice':state[b.dataset.group]=b.dataset.val;render();break;case 'to-intro':navigate('intro');break;case 'to-brief':navigate('brief');break;case 'to-discover':if(state.page==='inquiry')saveFields();navigate('discover');break;case 'to-saved':navigate('saved');break;case 'to-inquiry':if(!selectedMovies().length){notify('선택한 영상이 없어요.');return}navigate('inquiry');break;case 'to-review':saveFields();if(!state.inquiryText.trim()){notify('문의 내용을 입력해주세요.');$('#inquiry-message')?.focus();return}navigate('review');break;case 'save':toggleSaved(id);break;case 'preview-save':toggleSaved(id);break;case 'preview':previewMovie(id);break;case 'creator':creatorInfo(id);break;case 'close':$('#preview').close();break;case 'filter-style':state.filterStyle=b.dataset.val;render();break;case 'clear-filters':state.filterStyle='전체';state.filterRatio='전체';state.query='';render();break;case 'shuffle':shuffleOrder();break;case 'select-all':savedMovies().forEach(m=>state.selected.add(m.id));render();break;case 'select-none':state.selected.clear();render();break;case 'preset':demoPreset();break;case 'submit-demo':state.submitted=true;render();window.scrollTo({top:0,behavior:'instant'});break;}});
document.addEventListener('change',e=>{let el=e.target;if(el.matches('[data-select]')){const id=el.dataset.select;if(el.checked)state.selected.add(id);else state.selected.delete(id);render()}else if(el.id==='ratio-filter'){state.filterRatio=el.value;render()}else if(el.id==='event-date'){state.eventDate=el.value;render()}else if(el.id==='demo-file'){state.fileNames=[...el.files].map(f=>f.name);let n=$('#file-list');if(n)n.textContent=state.fileNames.length?state.fileNames.join(', '):'현재 선택한 파일 없음';notify('파일명만 확인했습니다. 업로드하지 않았어요.')}else if(el.id==='check-rights'){state.rightsChecked=el.checked}});
document.addEventListener('input',e=>{let el=e.target;if(el.id==='video-search'){state.query=el.value;const grid=$('.video-grid');const vis=visibleMovies();if(grid){let pos=el.selectionStart;let v=el.value;render();let newEl=$('#video-search');if(newEl){newEl.focus();newEl.setSelectionRange(pos,pos)}}}else{let map={'inquiry-name':'inquiryName','inquiry-message':'inquiryText','inquiry-due':'inquiryDue','inquiry-budget':'inquiryBudget'};if(map[el.id])state[map[el.id]]=el.value}});
window.addEventListener('popstate',()=>{let next=location.hash.replace('#','');if(!SCREENS.includes(next)){next='intro'}state.page=next;state.reached=Math.max(state.reached,SCREENS.indexOf(next));render()});
(function(){const hash=location.hash.slice(1);if(SCREENS.includes(hash)){state.page=hash;state.reached=SCREENS.indexOf(hash)}render()})();
</script>
</body>
</html>
