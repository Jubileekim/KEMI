name: Web CI

on:
  pull_request:
    branches:
      [
        main,
        feat/frontend-0abc-foundation,
        feat/frontend-1a-email-auth,
        feat/frontend-1b-google-auth,
        feat/frontend-1c-profiles,
      ]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:web
      # build:web는 타입 검사와 린트를 포함한다. DB·비밀값은 필요하지 않다.
      - run: npm run build:web
      - name: Chromium 설치
        run: npm exec -w @kemi/web -- playwright install --with-deps chromium
      - name: 데스크톱·모바일 브라우저 테스트
        run: npm run test:web:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
